name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "17 3 * * *"  # ежедневно 03:17 UTC — backup-verify (Промт 4 «Доделать.rtf»)

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high --omit=dev
      - run: npx tsc --noEmit
      - run: npx eslint . --max-warnings 0
      - run: npm run check:lint-gate
      - run: npx vitest run --config vitest.client.config.ts
      - run: npx vite build
      - run: node scripts/check-bundle-size.js

  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: servicedesk_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high --omit=dev
      - run: mysql -h 127.0.0.1 -u root -proot servicedesk_test < seed.sql
      - run: npx vitest run
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: servicedesk_test
          JWT_SECRET: test-secret
      - run: node --check src/index.js
      - name: migrations-lag (свежая БД + migrate:latest + сверка с knex_migrations)
        run: node ../scripts/migrations-lag-audit.mjs --setup
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: servicedesk_test
          JWT_SECRET: test-secret
      - name: schema-drift (Prisma ↔ свежая БД из миграций)
        run: node ../scripts/schema-drift-audit.mjs --setup
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: servicedesk_test
          JWT_SECRET: test-secret

  e2e:
    # P1 №11 (Что-доделать.txt): E2E (Playwright, 19 spec / 61 тест) + check-console
    # (26 страниц: 22 OK + 4 в TRACKED_ISSUES — подтверждённые дефекты, заведены
    # в «Что-доделать.txt», раздел «Вскрыто расширением check-console») на MySQL-контейнере. Раньше E2E гонялось только локально
    # (Laragon + dev-серверы) — PR не гейтились. БД готовится тем же путём, что и
    # серверные vitest-тесты: scripts/e2e-db-setup.mjs → server/test-db-setup.js
    # (migrate + seed — search.spec.ts:21 ждёт seed-тикет, а колонки SLA/lock
    # создают сами миграции: заплатки схемы из харнесса удалены). check-console запускается отдельным
    # шагом через scripts/ci-check-console.mjs (сам поднимает server:4000 + vite:5173
    # и использует auth.json, созданный playwright global-setup'ом).
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: servicedesk_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: servicedesk_test
      TEST_DB_NAME: servicedesk_test
      JWT_SECRET: test-secret
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/servicedesk_test
      DIRECT_DATABASE_URL: mysql://root:root@127.0.0.1:3306/servicedesk_test
      VAPID_PUBLIC_KEY: BKvM9b1p0vP3Q8j5tL7mW9nC4rX6yZ2aB8dE0gI3kO5sU7wY1cF4hJ6lN8pR2tV
      VAPID_PRIVATE_KEY: z9x8c7v6b5n4m3l2k1j0h9g8f7d6s5a4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: node scripts/e2e-db-setup.mjs
      - run: npx playwright install --with-deps chromium chrome
      - run: npx playwright test
      - run: node scripts/ci-check-console.mjs

  security-headers:
    # Гейт «заголовки безопасности на периметре» (P0 «Что-доделать.txt»).
    # Статический: доказывает, что заголовки объявлены в nginx.conf и vercel.json
    # (в оба location, потому что свой add_header обнуляет наследование),
    # что helmet смонтирован раньше express.static, что Dockerfile копирует
    # именно проверяемый конфиг. Зависимости не нужны: гейт только читает файлы.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check:headers

  menu-inventory:
    # Гейт «инвентарь меню» (пункт 1 разбора внешних аудитов): каждый пункт
    # sidebar.tsx/admin-layout.tsx обязан иметь (а) объявленный маршрут в App.tsx,
    # (б) ключ перевода и в ru, и в en, (в) роли из типа EmployeeRole,
    # (г) объявленный в миграциях флаг фичи, читаемый файлом меню через useFeature.
    # Список пунктов читается из самих TSX — хардкода в гейте нет. Статический:
    # только чтение файлов, зависимости не нужны. Раньше инвентарь протухал молча.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check:menu

  docs-canon:
    # Гейт канона доков («Что-доделать.txt», правило 20):
    #   1. check-doc-sync — журналы и AGENTS.md побайтово синхронны с test-analysis/,
    #      инвентарь тестов не старше прогонов (правило 19 — «правка .txt журналов»);
    #   2. check-backlog-closed-body — закрытая запись в бэклоге = ОДНА компактная
    #      строка ✅ + ссылка на «Что сделано.txt»; секция с ЗАКРЫТО/✅ и любым телом
    #      под ней («надгробие») = FAIL. Детали закрытого — только в «Что сделано.txt».
    #   3. check-doc-counters — числа тестов в шапках (Что-доделать/Что сделано/README/
    #      TECHNICAL/PLAYBOOK/AGENTS) сверяются с test-analysis/test-inventory.json
    #      (процесс №5); расхождение = FAIL, починка — `--fix`.
    #   4. check-backlog-schema — схема «Что-доделать.txt» (Этап 4): лимит 450 строк/
    #      90 000 байт, колонка ID (PREFIX-NN, legacy G1/Z8) без дублей, число ячеек
    #      строки = шапке, статусный префикс ⏳/✅/—, дата проверки у открытых P1.
    # Зависимости не нужны: все проверки только читают файлы.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check:docs

  alerts:
    # Гейт «правила алертинга» (пункт 2 «Перенос из SwiftMatch»): monitoring/alerts.yml
    # разбирается без зависимостей (подмножество YAML), каждая метрика из expr обязана
    # быть объявлена (# HELP/# TYPE) в server/src/middleware/metrics.js или
    # server/src/app.js (или быть встроенной — up/ALERTS), каждое правило обязано
    # иметь for/severity/summary/description, а файл — подключаться в monitoring/prometheus.yml
    # (rule_files) и монтироваться в docker-compose.yml. Иначе алерт живёт в списке
    # и никогда не срабатывает. Только чтение файлов, зависимости не нужны.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check:alerts

  backup-verify:
    # Ежедневная проверка, что mysqldump реально разворачивается (Промт 4 «Доделать.rtf»).
    # В CI валидируем seed.sql (содержит CREATE TABLE + INSERT — те же проверки COUNT>0);
    # локально: node scripts/verify-backup.mjs — берёт последний .sql из backups/.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: servicedesk
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      # 1. Наполняем БД сервиса из seed.sql (схема + данные)
      - run: mysql -h 127.0.0.1 -u root -proot servicedesk < server/seed.sql
      # 2. Снимаем настоящий mysqldump — именно такие файлы лежат в backups/
      - run: mysqldump -h 127.0.0.1 -u root -proot servicedesk > /tmp/backup-verify.sql
      # 3. Проверяем, что дамп разворачивается (CREATE → INSERT → COUNT>0 → DROP)
      - run: node scripts/verify-backup.mjs /tmp/backup-verify.sql
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: servicedesk
