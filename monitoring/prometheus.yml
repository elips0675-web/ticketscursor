global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - '/etc/prometheus/alerts.yml'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'api'
    static_configs:
      - targets: ['api:4000']
    metrics_path: '/api/metrics'

  - job_name: 'node'
    static_configs:
      - targets: ['host.docker.internal:9100']
